<!DOCTYPE html>
<html lang="en" class="scroll-smooth" style="scroll-padding-top: 100px;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammed Roshan M | Astrophysics & AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              mono: ['"Space Mono"', 'monospace'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              nothing: {
                black: '#0a0a0a',
                dark: '#121212',
                gray: '#333333', // Brightened from #262626
                light: '#b5b5b5', // Brightened from #a3a3a3
                white: '#ffffff', // Brightened from #f5f5f5
                red: '#D71921', // Nothing OS Red
              }
            },
            backgroundImage: {
              'dot-pattern': 'radial-gradient(#333333 1px, transparent 1px)',
            },
            backgroundSize: {
              'dot-size': '24px 24px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a0a;
        color: #ffffff;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #D71921;
      }
      
      /* Glitch Animation Utility */
      .glitch-hover:hover {
        animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        color: #D71921;
      }
      @keyframes glitch {
        0% { transform: translate(0) }
        20% { transform: translate(-2px, 2px) }
        40% { transform: translate(-2px, -2px) }
        60% { transform: translate(2px, 2px) }
        80% { transform: translate(2px, -2px) }
        100% { transform: translate(0) }
      }
      
      .dotted-bg {
        background-image: radial-gradient(#333333 1px, transparent 1px);
        background-size: 20px 20px;
      }

      /* Star Animations */
      .stars-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .stars-small {
        width: 1px;
        height: 1px;
        background: transparent;
        box-shadow: 10vw 20vh #fff, 30vw 10vh #fff, 50vw 80vh #fff, 80vw 15vh #fff, 10vw 90vh #fff, 
                    90vw 80vh #fff, 20vw 40vh #fff, 60vw 20vh #fff, 40vw 60vh #fff, 70vw 40vh #fff,
                    15vw 25vh #fff, 35vw 15vh #fff, 55vw 85vh #fff, 85vw 20vh #fff, 15vw 95vh #fff, 
                    95vw 85vh #fff, 25vw 45vh #fff, 65vw 25vh #fff, 45vw 65vh #fff, 75vw 45vh #fff,
                    5vw 5vh #fff, 45vw 5vh #fff, 95vw 5vh #fff, 25vw 95vh #fff, 65vw 95vh #fff;
        animation: animStar 100s linear infinite;
        opacity: 0.5;
      }

      .stars-medium {
        width: 2px;
        height: 2px;
        background: transparent;
        box-shadow: 50vw 30vh #555, 20vw 80vh #555, 80vw 40vh #555, 40vw 20vh #555, 
                    60vw 60vh #555, 10vw 50vh #555, 90vw 10vh #555;
        animation: animStar 150s linear infinite;
        opacity: 0.8;
      }
      
      @keyframes animStar {
        from { transform: translateY(0px); }
        to { transform: translateY(-1000px); }
      }

    </style>

{
  "imports": {

    "react-markdown": "https://esm.sh/react-markdown@9?bundle",
    "remark-math": "https://esm.sh/remark-math@6?bundle",
    "rehype-katex": "https://esm.sh/rehype-katex@7?bundle",
    "remark-gfm": "https://esm.sh/remark-gfm@4?bundle"
  }
}
</script>
</head>
